name: may-chat-local
services:
  server:
    image: may-chat-server:local
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_ORIGIN: http://localhost:8088
      TRUST_PROXY: 'true'
      TOKIO_WORKER_THREADS: '2'
      RUST_LOG: may_server=info,tower_http=warn
    volumes: [app_data:/app/data]
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    healthcheck:
      test: [CMD, curl, -f, -s, http://127.0.0.1:8080/api/health]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  web:
    image: may-chat-web:local
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    restart: unless-stopped
    ports: ['127.0.0.1:8088:80']
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server: {condition: service_healthy}
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
volumes:
  app_data:
  caddy_data:
  caddy_config:
